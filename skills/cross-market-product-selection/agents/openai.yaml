interface:
  display_name: "通用跨市场选品与货源匹配"
  short_description: "多产品 Agent：逐产品确认外观、功能和目标价格后，交付可审计的中文 Excel"
  default_prompt: "使用 $cross-market-product-selection 执行多产品选品。先为每个目标产品分配目标产品ID，分别确认实际参考图、必需视图、外观、功能、排除项、Amazon目标站点、目标售价/成本、价格偏差和目标数量；再按目标产品ID独立检索、去重、取价、评分和排名。严格多视图候选须嵌入商品主图及对比/结构图，并逐项写明候选可见事实、对标参考和关键差异。Amazon候选价格不得低于该目标产品的合格同类均价，样本商品ID与跨站产品组ID都要去重；1688须绑定SKU、目标采购档位、MOQ和对应档位价，实际单价必须等于该档报价。候选表不得混入已淘汰，每个候选嵌入商品主图，全部 URL 单击可打开；只对严格合格项按销量40%、价格40%、评价20%评分并生成固定九表的中文 Excel。"
